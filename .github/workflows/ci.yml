name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source and scripts
        run: |
          python -m compileall src scripts

      - name: Check required files
        run: |
          python - <<'PY'
          from pathlib import Path

          required_files = [
              "src/dashboard.py",
              "src/prediction.py",
              "src/league_simulation.py",
              "scripts/update_all_data.py",
              "requirements.txt",
              "README.md",
              "Dockerfile",
              "docker-compose.yml",
              ".dockerignore",
          ]

          missing = [path for path in required_files if not Path(path).exists()]

          if missing:
              raise SystemExit(f"Missing required files: {missing}")

          print("Required project files found.")
          PY

      - name: Run tests
        run: |
          python -m pytest -q

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: python-checks

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t football-analytics:test .

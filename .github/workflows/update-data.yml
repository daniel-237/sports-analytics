name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  update-data:
    name: Refresh football data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run safe data update
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python scripts/update_all_data.py

      - name: Commit updated data files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/processed/current_tables.csv
          git add data/processed/upcoming_fixtures.csv
          git add data/processed/latest_results.csv
          git add data/processed/api_football_fixtures.csv
          git add data/processed/api_football_standings.csv
          git add data/processed/api_football_injuries.csv
          git add data/processed/api_football_lineups.csv

          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh football data"
            git push
          fi